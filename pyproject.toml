[project]
name = "gems"
version = "0.1.0"
description = "Fault probability maps for the DOE GEMS Prize"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "rasterio>=1.5.2",
    "scikit-learn>=1.9.1",
]

[project.scripts]
gems = "gems.cli:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
